name: CI — Regression Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Permite execução manual com escolha de perfil
  workflow_dispatch:
    inputs:
      maven_profile:
        description: "Perfil Maven a executar (smoke | regression | ci)"
        required: false
        default: "ci"
      tags:
        description: "Tags a executar. Aceita 'or'/'and'/'not' (ex: @tagA or @tagB) ou lista separada por ',' ou ';' (ex: @tagA,@tagB)"
        required: false
        default: ""

jobs:
  test:
    name: "Automated Tests (${{ github.event.inputs.maven_profile || 'ci' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java 17 com cache Maven
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download a Build Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: Download artifactory
    

      # 3. Cria test-data.properties (credenciais públicas do Sauce Demo — sem secrets)
      - name: Configurar dados de teste
        run: |
          cp src/test/resources/test-data.properties.example \
             src/test/resources/test-data.properties

      # 4. Executa os testes com o perfil selecionado
      #    Os secrets são passados como -D para garantir prioridade máxima no
      #    TestDataConfig (system property > variável de ambiente > arquivo)
      #
      #    Se o input "tags" (workflow_dispatch) for preenchido, ele sobrescreve
      #    a tag padrão do perfil Maven via -Dcucumber.tags — CLI -D tem
      #    precedência sobre a property definida no <profile> do pom.xml.
      #    ',' e ';' são normalizados para o operador "or" do Cucumber Tag
      #    Expressions, permitindo colar listas de tags (estilo Jira/Octane)
      #    sem precisar conhecer a sintaxe do Cucumber.
      #
      #    mvn test roda primeiro (isolado) para permitir validar se alguma
      #    tag realmente bateu com algum cenário antes de gerar o relatório —
      #    sem isso, 0 cenários encontrados gera uma falha genérica e confusa
      #    no plugin maven-cucumber-reporting ("Passed files have no features!").
      - name: Executar testes
        env:
          TAGS_INPUT: ${{ github.event.inputs.tags }}
        run: |
          set -e -o pipefail
          PROFILE="${{ github.event.inputs.maven_profile || 'ci' }}"

          TAGS_ARG=()
          if [ -n "$TAGS_INPUT" ]; then
            NORMALIZED_TAGS=$(echo "$TAGS_INPUT" | sed -E 's/[;,]+/ or /g' | sed -E 's/ +/ /g' | sed -E 's/^ | $//g')
            echo "Sobrescrevendo tags do perfil '$PROFILE' com: $TAGS_INPUT -> $NORMALIZED_TAGS"
            TAGS_ARG=(-Dcucumber.tags="$NORMALIZED_TAGS")
          fi

          mvn test -P "$PROFILE" --no-transfer-progress \
            "${TAGS_ARG[@]}"

          SCENARIOS=$(jq '[.[].elements | length] | add // 0' target/reports/CucumberReports.json)
          if [ "$SCENARIOS" -eq 0 ]; then
            echo "::error::Nenhum cenario foi encontrado para as tags informadas. Confira o nome das tags e a sintaxe (use 'or'/'and'/'not', ex: @tagA or @tagB)."
            exit 1
          fi

          mvn verify -P "$PROFILE" --no-transfer-progress -DskipTests \
            "${TAGS_ARG[@]}"

      # 5. Upload do relatório HTML (disponível por 30 dias na aba Actions)
      - name: Upload relatório HTML
        if: always()   # executa mesmo se os testes falharem
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report-${{ github.run_number }}
          path: target/cucumber-html-reports/
          retention-days: 30

      # 6. Upload das evidências PDF
      - name: Upload evidências PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-pdf-${{ github.run_number }}
          path: src/evidencias/
          retention-days: 30

      # 7. Publica resumo no GitHub Actions
      - name: Publicar resumo
        if: always()
        run: |
          echo "## Resultado dos Testes 🧪" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Perfil | \`${{ github.event.inputs.maven_profile || 'ci' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags (override manual) | \`${{ github.event.inputs.tags || '(nenhuma — usou tag padrão do perfil)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Relatório completo disponível nos **Artifacts** desta execução." >> $GITHUB_STEP_SUMMARY
